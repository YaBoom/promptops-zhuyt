[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptops-zhuyt"
version = "1.1.0"
description = "Lightweight Prompt Engineering Operations CLI - Version control, real LLM testing, and deployment for AI prompts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "jack.zhu", email = "jack.zhu@example.com"}
]
keywords = [
    "promptops",
    "prompt-engineering",
    "llm",
    "ai",
    "version-control",
    "prompt-management",
    "dspy",
    "openai",
    "deepseek"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]
eval = [
    "deepeval>=0.21.0",
    "langfuse>=2.0.0"
]

[project.scripts]
promptops = "promptops.cli:main"

[project.urls]
Homepage = "https://github.com/YaBoom/promptops-zhuyt"
Repository = "https://github.com/YaBoom/promptops-zhuyt"
Issues = "https://github.com/YaBoom/promptops-zhuyt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true